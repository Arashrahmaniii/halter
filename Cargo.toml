[workspace]
resolver = "2"
members = ["contracts/halter-wallet", "contracts/halter-registry"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Arashrahmaniii/halter"

[workspace.dependencies]
near-sdk = "5.30.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
